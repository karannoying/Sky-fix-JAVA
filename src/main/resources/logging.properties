# SKYFIX default logging (NFR-5, architecture I4).
#
# The console carries WARNING and above, so a run summary is readable: a wind-extrapolation
# warning or a failed member is visible, while per-phase INFO is not mixed into the report table.
# The detail goes to out/skyfix.0.log (rotating over three generations), which is where
# NFR-5's audit trail lives.
#
# Override with -Djava.util.logging.config.file=<your.properties>.

handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler
.level = INFO

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.FileHandler.pattern = out/skyfix.%g.log
java.util.logging.FileHandler.limit = 5000000
java.util.logging.FileHandler.count = 3
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.level = INFO
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

java.util.logging.SimpleFormatter.format = %1$tFT%1$tT %4$-7s %3$s %5$s%6$s%n

com.skyfix.level = INFO
