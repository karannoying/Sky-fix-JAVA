# Test logging: SKYFIX logs INFO per flight phase (NFR-5), which is useful in the CLI and noise
# in a test run. Tests keep WARNING and above so a wind-extrapolation or resample warning is
# still visible when it matters.
handlers = java.util.logging.ConsoleHandler
.level = WARNING
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = [%4$s] %5$s%n
com.skyfix.level = WARNING
